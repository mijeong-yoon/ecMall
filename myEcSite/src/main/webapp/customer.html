<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>カスタマーセンター - ShoppingMall</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-container" style="max-width: 600px;">
            <div class="auth-title">お問い合わせ</div>
            
            <div style="margin-bottom: 20px; font-size: 14px; color:#666; line-height: 1.5;">
                ご不明な点がございましたら、以下のフォームよりお問い合わせください。<br>
            </div>

            <form onsubmit="alert('お問い合わせを受け付けました。'); location.href='index.html'; return false;">
                <div class="form-group">
                    <label>お問い合わせ種類</label>
                    <select class="form-control">
                        <option>商品について</option>
                        <option>配送について</option>
                        <option>返品・返金について</option>
                        <option>その他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>タイトル</label>
                    <input type="text" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>内容</label>
                    <textarea class="form-control" style="height: 150px; resize: none;" required></textarea>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; padding: 14px;">送信</button>
            </form>
        </div>
    </div>

</body>
</html>
